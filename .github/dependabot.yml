version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - dependencies
    groups:
      frontend-runtime:
        patterns:
          - react
          - react-dom
          - react-router
          - react-router-dom
          - "@tanstack/*"
      build-and-test:
        dependency-type: development
        patterns:
          - vite
          - vitest
          - "@vitejs/*"
          - "@vitest/*"
          - typescript
          - eslint
          - "typescript-eslint"
